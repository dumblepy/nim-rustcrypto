[package]
name = "halo2-ipa-prover"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[features]
# Declared so the shared `halo2_ipa.rs` check-cfg stays quiet. This browser
# adapter always includes the prover, so the feature stays off.
halo2-ipa-verify-only = []
# Declared for the same reason; this adapter uses the uncached prover path.
halo2-ipa-params-cache = []

[dependencies]
ark-bn254 = "0.5"
ark-ec = "0.5"
ark-ff = "0.5"
halo2-axiom = "0.5.3"
rand_core = { version = "0.6", features = ["getrandom"] }
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen = "=0.2.129"
zeroize = "1.8"

[patch.crates-io]
# Same vendored copy as rustcrypto-ffi. The patch removes `multicore` from the
# default feature list so wasm32-unknown-unknown (without atomics) can build.
halo2-axiom = { path = "../../rustcrypto-ffi/third_party/halo2-axiom-0.5.3" }
