name: test

on:
  pull_request:

permissions:
  contents: read

jobs:
  zkp-integration:
    name: ZKP integration
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    env:
      ZKP_RUST_WASM_TARGETS_INSTALLED: "1"
      CC_wasm32_unknown_unknown: clang
      CC_wasm32_wasip1: clang
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, wasm32-wasip1

      - name: Install LLVM tools for archive symbol checks
        run: rustup component add llvm-tools-preview

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install Nim toolchain
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install WASM bridge generator
        working-directory: rustcrypto-ffi
        run: cargo install --locked wasm-bindgen-cli --version 0.2.129

      - name: Set shared Cargo build directory
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/zkp-cargo-target" >> "$GITHUB_ENV"

      - name: Install browser dependencies
        working-directory: web/groth16-prover
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Test Groth16 across browser, Node, WASI and ICP
        id: groth16
        env:
          GROTH16_BROWSER_DEPS_INSTALLED: "1"
        run: ./ci/test_groth16_web.sh

      - name: Test Bulletproofs R1CS across Nim, Node, Worker and WASI
        id: bulletproofs
        if: ${{ !cancelled() && (steps.groth16.outcome == 'success' || steps.groth16.outcome == 'failure') }}
        run: ./ci/test_bulletproofs_r1cs.sh "$RUNNER_TEMP/bulletproofs-r1cs"

      - name: Upload Bulletproofs R1CS measurements
        if: ${{ !cancelled() && steps.bulletproofs.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: bulletproofs-r1cs-poc-measurements
          path: |
            ${{ runner.temp }}/bulletproofs-r1cs/environment.txt
            ${{ runner.temp }}/bulletproofs-r1cs/native-measurements.csv
            ${{ runner.temp }}/bulletproofs-r1cs/native-rss.txt
            ${{ runner.temp }}/bulletproofs-r1cs/wasm-measurements.json

      - name: Test Halo2 KZG/BN254 native and WASM fixture smoke
        id: halo2
        if: ${{ !cancelled() }}
        run: ./ci/test_halo2_wasm.sh "$RUNNER_TEMP/halo2-kzg-bn254"

      - name: Upload Halo2 KZG/BN254 smoke report
        if: ${{ !cancelled() && steps.halo2.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: halo2-kzg-bn254-smoke
          path: |
            ${{ runner.temp }}/halo2-kzg-bn254/environment.txt
            ${{ runner.temp }}/halo2-kzg-bn254/symbols.txt

  # Linux x86_64 上の開発用 Docker イメージで、既存の test.sh（Rust + wasm/wasi クロスビルド + Nim）を実行する。
  linux-x86_64-docker-compose:
    name: Linux x86_64 (Docker)
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build app image
        run: docker compose build app

      - name: Start app service
        run: docker compose up -d app

      - name: Run package checks
        run: docker compose exec -T app bash -lc '/application/test.sh'

      - name: Stop compose services
        if: always()
        run: docker compose down --remove-orphans

  # Apple Silicon 上で Rust（ネイティブ）と Nim（nimble test）のみ動作確認する。
  # wasm / wasi（blst の C ビルドを含む）は Linux Docker ジョブで検証する（macOS の clang は wasm32-unknown-unknown 非対応）。
  macos-arm64-smoke:
    name: macOS arm64 (Apple Silicon)
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Nim toolchain
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rust tests and Nim tests (Apple Silicon native)
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          ./test.sh
