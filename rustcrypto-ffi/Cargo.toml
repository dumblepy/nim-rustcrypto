[package]
name = "rustcrypto-ffi"
version = "0.1.6"
edition = "2024"

[dependencies]
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc"] }
aes-gcm-siv = { version = "0.11.1", default-features = false, features = ["aes", "alloc"] }
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "password-hash"] }
ark-bn254 = "0.5.0"
ark-ec = "0.5.0"
ark-ff = "0.5.0"
ark-groth16 = { version = "0.5.0", default-features = false, features = ["std"] }
ark-r1cs-std = "0.5"
ark-relations = "0.5"
ark-serialize = "0.5.0"
bincode = "1.3.3"
blake2 = "0.10.6"
blst = "0.3.16"
bulletproofs = { git = "https://github.com/zkcrypto/bulletproofs", rev = "04bce4e66013ff857ed462fd4206210544101461", version = "5.0.1", features = ["yoloproofs"], optional = true }
chacha20 = { version = "0.9", features = ["zeroize"] }
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
const-oid = "0.9.6"
curve25519-dalek = { version = "=4.1.3", optional = true }
digest = "0.11.2"
ed25519 = { version = "2.2.3", default-features = false, features = ["alloc", "pem", "pkcs8"] }
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["alloc", "pkcs8", "signature", "zeroize"] }
genshi-core = { version = "0.3.0", default-features = false, features = ["std", "math-native"] }
genshi-math = "0.3.0"
hkdf = "0.13.0"
hmac = "0.13.0"
hpke = { version = "0.13", default-features = false, features = ["alloc", "x25519"] }
k256 = { version = "0.13.4", default-features = false, features = ["alloc", "ecdsa", "pem", "pkcs8", "schnorr"] }
light-poseidon = "0.4.1"
merlin = { version = "=3.0.0", optional = true }
p256 = { version = "0.13.2", default-features = false, features = ["alloc", "ecdsa", "pem", "pkcs8"] }
p384 = { version = "0.13.1", default-features = false, features = ["alloc", "ecdsa", "pem", "pkcs8"] }
password-hash = { version = "0.6.1", default-features = false, features = ["alloc", "phc"] }
pbkdf2 = "0.13.0"
pem-rfc7468 = "1.0.0"
plonky2 = { version = "1.6.0", package = "qp-plonky2", default-features = false, features = ["std"] }
qp-plonky2-verifier = { version = "1.6.0", default-features = false, features = ["std"] }
rand_core = { version = "0.6.4", default-features = false, features = ["getrandom"] }
rsa = { version = "0.9.8", default-features = false, features = ["pem", "sha2", "u64_digit"] }
scrypt = "0.12.0"
snark-verifier = { version = "0.2.7", default-features = false }
sha2 = "0.11.0"
sha3 = "0.11.0"
# hpke disables dalek default features; explicitly retain secret zeroization.
x25519-dalek = { version = "2", default-features = false, features = ["zeroize", "static_secrets"] }
x509-cert = "0.2.5"
zeroize = "1.8"

[patch.crates-io]
# halo2-axiom 0.5.3 enables `multicore` by default, which is a hard compile
# error on wasm32 without atomics. The local copy changes only the default
# feature list (multicore is removed); see third_party/PATCH.md.
halo2-axiom = { path = "third_party/halo2-axiom-0.5.3" }

[lib]
name = "rust_crypto_ffi"
crate-type = ["staticlib", "rlib"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bcrypt = "0.19.1"
# Re-enable halo2-axiom's parallel path on native targets. The vendored
# halo2-axiom patch removes `multicore` from its default features so that
# wasm32 (without atomics) can build; native keeps the same behaviour as
# upstream by selecting it explicitly here.
halo2-axiom = { version = "0.5.3", features = ["multicore"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen = { version = "=0.2.129", optional = true }

[dev-dependencies]
ark-relations = "0.5"
ark-snark = "0.5"
ark-std = "0.5"
genshi-core = { version = "0.3.0", default-features = false, features = ["std", "math-native", "prover"] }
rand = "0.8"

[features]
bulletproofs-r1cs-poc = ["dep:bulletproofs", "dep:curve25519-dalek", "dep:merlin"]
bulletproofs-r1cs-web-poc = ["bulletproofs-r1cs-poc", "dep:wasm-bindgen"]

[[example]]
name = "bulletproofs_r1cs_web"
crate-type = ["cdylib"]
required-features = ["bulletproofs-r1cs-web-poc"]

[[example]]
name = "bulletproofs_r1cs_interop"
required-features = ["bulletproofs-r1cs-poc"]

[[example]]
name = "halo2_verify_web"
crate-type = ["cdylib"]
