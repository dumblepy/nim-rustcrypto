[package]
name = "halo2-ipa-external-circuit"
version = "0.1.0"
edition = "2024"
publish = false
description = "Example external Halo2 IPA circuit registered at compile time via rustcrypto-ffi"

[lib]
name = "halo2_ipa_external_circuit"
path = "src/lib.rs"
# Demonstrate that a consumer can ship its own staticlib exporting the
# macro-generated adapter symbols alongside rustcrypto-ffi's archive.
crate-type = ["staticlib", "rlib"]

[dependencies]
rustcrypto-ffi = { path = "../../rustcrypto-ffi" }
halo2-axiom = { version = "0.5.3" }

# Use the same vendored halo2-axiom copy as rustcrypto-ffi so the `Circuit`
# trait and key types are the same crate instance across the dependency graph.
[patch.crates-io]
halo2-axiom = { path = "../../rustcrypto-ffi/third_party/halo2-axiom-0.5.3" }
